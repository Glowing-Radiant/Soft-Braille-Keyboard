plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dalton.braillekeyboard'
    compileSdk 35
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId "com.dalton.braillekeyboard"
        minSdk 21
        targetSdk 35
        // The release workflow passes the version from the git tag.
        versionCode project.findProperty('sbkVersionCode')?.toInteger() ?: 57
        versionName project.findProperty('sbkVersionName') ?: "4.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Lets resources name this app's package, see the debug build type.
        resValue 'string', 'application_id', 'com.dalton.braillekeyboard'

        ndk {
            // liblouis is built from source for every ABI, so the app runs
            // natively on 64-bit only devices.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            // Provided by the release workflow from repository secrets. See
            // RELEASING.md. Without them the release APK is left unsigned.
            def keystore = System.getenv('SIGNING_KEYSTORE_PATH')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // A separate app, so a development build installs next to a
            // release signed with another key instead of replacing it.
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            resValue 'string', 'application_id', 'com.dalton.braillekeyboard.dev'
        }
        release {
            if (System.getenv('SIGNING_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
