name: Release

# Builds a signed release APK and publishes it as a GitHub release.
# Trigger it by pushing a version tag (git tag v3.2.0 && git push origin v3.2.0)
# or run it from the Actions tab. See RELEASING.md for the one-time setup of
# the signing secrets.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name without the leading v, e.g. 3.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and CMake
      # Must match ndkVersion and the CMake version in app/build.gradle.
      run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

    - name: Work out the version
      id: version
      env:
        EVENT: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$EVENT" = "push" ]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="${INPUT_VERSION#v}"
        fi
        if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::'$version' isn't a version like 3.2.0 or 3.2.0-beta1"
          exit 1
        fi
        echo "name=$version" >> "$GITHUB_OUTPUT"
        # Android only installs updates with a higher versionCode, so derive
        # it from the ever increasing run number of this workflow.
        echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

    - name: Decode the signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Signing secrets are missing. See RELEASING.md."
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    - name: Test and build the release APK
      env:
        SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
        VERSION_CODE: ${{ steps.version.outputs.code }}
      run: |
        chmod +x gradlew
        ./gradlew testReleaseUnitTest assembleRelease --stacktrace \
          -PsbkVersionName="$VERSION_NAME" -PsbkVersionCode="$VERSION_CODE"

    - name: Verify the signature
      run: |
        apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
      run: |
        apk="SoftBrailleKeyboard-$VERSION_NAME.apk"
        cp app/build/outputs/apk/release/app-release.apk "$apk"
        sha256sum "$apk" > "$apk.sha256"
        prerelease=""
        if [[ "$VERSION_NAME" == *-* ]]; then prerelease="--prerelease"; fi
        gh release create "v$VERSION_NAME" "$apk" "$apk.sha256" \
          --title "Soft Braille Keyboard $VERSION_NAME" \
          --target "$GITHUB_SHA" --generate-notes $prerelease
